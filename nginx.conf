server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ponytail: API has no CORS headers — proxy /api same as vite dev proxy
    location /api/ {
        proxy_pass https://api.everynaira.ng/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.everynaira.ng;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }

    # SPA fallback + PWA static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
