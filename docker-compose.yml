services:
  dev:
    build:
      context: .
      target: builder
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DISABLE_HMR=false
    volumes:
      - .:/app:chmod775
      - /app/node_modules
    command: ["npm", "run", "dev"]
    # Changes to src/ or public/ are reflected instantly — Vite HMR pushes updates

  # Production build served by nginx
  prod:
    build:
      context: .
      target: runner
    restart: always
    ports:
      - "3000:80"
